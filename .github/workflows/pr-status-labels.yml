name: PR Status · Colored Labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
  workflow_run:
    workflows: ["CI · Quality Gate"]
    types: [completed]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-status-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile status labels
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const labels = {
              'status:open': ['86EFAC','OPEN - waiting for all merge conditions'],
              'status:ci-pending': ['FDE68A','CI PENDING'],
              'status:failed': ['FECACA','FAILED - inspect check runs'],
              'status:passed-ok-to-auto-merge': ['BBF7D0','PASSED OK TO AUTO-MERGE']
            };
            for (const [name,[color,description]] of Object.entries(labels)) {
              try {
                const {data: existing} = await github.rest.issues.getLabel({owner,repo,name});
                if (existing.color.toUpperCase() !== color) {
                  await github.rest.issues.updateLabel({owner,repo,name,color,description});
                }
              } catch(err) {
                if(err.status !== 404) throw err;
                try { await github.rest.issues.createLabel({owner,repo,name,color,description}); }
                catch(e) { if(e.status !== 422) throw e; }
              }
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,repo,base:'main',state:'open',per_page:100
            });
            for (const listed of prs) {
              // Read current head and mergeability, never rely on an old event payload.
              const {data:pr} = await github.rest.pulls.get({owner,repo,pull_number:listed.number});
              const sha = pr.head.sha;
              const {data:checks} = await github.rest.checks.listForRef({
                owner,repo,ref:sha,per_page:100,filter:'latest'
              });
              // Reflect the required quality gate only. Nonrequired metadata
              // labeling jobs can have historical 403 failures even though
              // all tests, lint, and build have passed on the current PR head.
              const required = checks.check_runs.find(c =>
                c.name === 'Test and build (Node 22)' &&
                c.head_sha === sha && c.app?.slug === 'github-actions');
              const failedCI = required?.status === 'completed' &&
                !['success', 'skipped', 'neutral'].includes(required.conclusion);
              const greenCI = required?.status === 'completed' &&
                required.conclusion === 'success';
              const mergeBlocked = pr.draft || pr.mergeable !== true ||
                ['dirty', 'blocked', 'draft', 'unknown', 'behind'].includes(pr.mergeable_state);
              // Purple OPEN is the neutral state, not an error.
              const desired = failedCI ? 'status:failed' :
                (!required || required.status !== 'completed' ? 'status:ci-pending' :
                 (greenCI && !mergeBlocked ? 'status:passed-ok-to-auto-merge' : 'status:open'));
              const existing = await github.paginate(github.rest.issues.listLabelsOnIssue,{
                owner,repo,issue_number:pr.number,per_page:100
              });
              for (const item of existing) {
                if (item.name.startsWith('status:') && item.name !== desired) {
                  await github.rest.issues.removeLabel({
                    owner,repo,issue_number:pr.number,name:item.name
                  });
                }
              }
              if (!existing.some(l=>l.name === desired)) {
                await github.rest.issues.addLabels({
                  owner,repo,issue_number:pr.number,labels:[desired]
                });
              }
              core.info('PR #'+pr.number+' '+sha.slice(0,7)+' -> '+desired);
            }
