name: Release Version · Label Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: version-label-reconciliation
  cancel-in-progress: false

jobs:
  version:
    name: Assign release type and planned fix version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read PR metadata, derive SemVer and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // PR events update a single PR. Any push to main, schedule, or
            // manual dispatch reconciles every currently open PR automatically.
            const numbers = context.payload.pull_request
              ? [context.payload.pull_request.number]
              : (await github.paginate(github.rest.pulls.list, {
                  owner, repo, base: 'main', state: 'open', per_page: 100
                })).map(pr => pr.number);
            core.info('Reconciling ' + numbers.length + ' open PR(s)');
            for (const number of numbers) {
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number:number});
            if (pr.base.ref !== 'main' || pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.notice('Skipped external or non-main PR #' + number); continue;
            }
            if (pr.state !== 'open') { core.notice('PR #' + number + ' is no longer open'); continue; }

            // Always read trusted base-release metadata, not untrusted PR content.
            const { data: releases } = await github.rest.repos.listReleases({owner, repo, per_page:100});
            const tags = releases
              .filter(r => !r.draft && !r.prerelease)
              .map(r => (r.tag_name || '').match(/^v(\d+)\.(\d+)\.(\d+)$/))
              .filter(Boolean).map(m => m.slice(1).map(Number));
            const {data:file} = await github.rest.repos.getContent({owner, repo, path:'package.json', ref:'main'});
            const rootPkg = JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));
            const initial = String(rootPkg.version || '0.0.0').match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!initial) throw Error('Invalid root package version');
            tags.push(initial.slice(1).map(Number));
            tags.sort((a,b)=>b[0]-a[0] || b[1]-a[1] || b[2]-a[2]);
            const current = tags[0];

            const title = pr.title || '';
            const breaking = /^(\w+)(\([^)]*\))?!:/.test(title) || /\[breaking\]/i.test(title);
            const kind = breaking ? 'major'
              : /^feat(\([^)]*\))?:/i.test(title) ? 'minor' : 'patch';
            const proposed = [...current];
            if (kind === 'major') { proposed[0]++; proposed[1]=0; proposed[2]=0; }
            else if (kind === 'minor') { proposed[1]++; proposed[2]=0; }
            else proposed[2]++;
            const version = 'v' + proposed.join('.');
            // This is a planned fix version, not a guarantee that release exists.
            const wanted = ['release:' + kind, 'fix-version:' + version];
            const existing = await github.paginate(github.rest.issues.listLabelsOnIssue,
              {owner,repo,issue_number:number,per_page:100});
            for (const label of existing) {
              if ((label.name.startsWith('release:') || label.name.startsWith('fix-version:')) && !wanted.includes(label.name)) {
                await github.rest.issues.removeLabel({owner,repo,issue_number:number,name:label.name});
              }
            }
            const palette = {major:'B60205',minor:'1D76DB',patch:'0E8A16'};
            const labels = [
              {name:'release:'+kind, color:palette[kind], description:'SemVer release impact: '+kind},
              {name:'fix-version:'+version, color:'5319E7', description:'Planned release (not yet published): '+version}
            ];
            for (const label of labels) {
              try { await github.rest.issues.getLabel({owner,repo,name:label.name}); }
              catch (e) {
                if (e.status !== 404) throw e;
                try { await github.rest.issues.createLabel({owner,repo,...label}); }
                catch (conflict) { if (conflict.status !== 422) throw conflict; }
              }
            }
            await github.rest.issues.addLabels({owner,repo,issue_number:number,labels:wanted});
            core.notice('PR #'+number+' → '+wanted.join(' · ')+' (planned, based on latest stable release/root version)');
            }
