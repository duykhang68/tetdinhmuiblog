name: Auto-merge · CI Green PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]
  workflow_run:
    workflows: ["CI · Quality Gate"]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge exactly one CI-green PR per run
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check CI of current head and merge a safe PR
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const requiredCheck = 'Test and build (Node 22)';
            if (context.eventName === 'workflow_run' &&
                (context.payload.workflow_run?.name !== 'CI · Quality Gate' ||
                 context.payload.workflow_run?.conclusion !== 'success')) {
              core.notice('CI workflow was not successful; skip merge');
              return;
            }
            const items = await github.paginate(github.rest.pulls.list,{
              owner,repo,base:'main',state:'open',
              sort:'created',direction:'asc',per_page:100
            });
            let merged = false;
            for (const item of items) {
              const {data:pr} = await github.rest.pulls.get({
                owner,repo,pull_number:item.number
              });
              if (pr.draft || pr.state !== 'open' ||
                  pr.head.repo?.full_name !== context.repo.owner+'/'+context.repo.repo) {
                core.info('PR #'+pr.number+': draft, closed, or fork: skipped');
                continue;
              }
              const sha = pr.head.sha;
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner,repo,ref:sha,filter:'latest',per_page:100
              });
              const ci = runs.filter(c => c.name === requiredCheck &&
                c.app?.slug === 'github-actions');
              if (!ci.some(c=>c.head_sha===sha &&
                    c.status==='completed' && c.conclusion==='success')) {
                core.info('PR #'+pr.number+': required CI not green on '+sha.slice(0,8));
                continue;
              }
              // "unstable" may mean an unrelated, non-required label job
              // failed. GitHub still enforces all active branch rules on merge.
              if (pr.mergeable !== true || pr.mergeable_state === 'dirty' ||
                  pr.mergeable_state === 'blocked' ||
                  pr.mergeable_state === 'draft' ||
                  pr.mergeable_state === 'unknown') {
                core.warning('PR #'+pr.number+': cannot merge: '+
                  pr.mergeable_state+' (mergeable='+pr.mergeable+')');
                continue;
              }
              // The exact SHA prevents merging new commits that have not
              // yet passed their own CI. Server-side rules are not bypassed.
              try {
                const result = await github.rest.pulls.merge({
                  owner,repo,pull_number:pr.number,sha,
                  merge_method:'squash',
                  commit_title:pr.title+' (#'+pr.number+')'
                });
                if (!result.data.merged) {
                  core.warning('PR #'+pr.number+': GitHub did not merge: '+
                    result.data.message);
                  continue;
                }
                merged = true;
                core.notice('AUTO-MERGED PR #'+pr.number+
                  ' after required CI passed on '+sha.slice(0,8));
                // A push made with GITHUB_TOKEN does not normally start
                // other push workflows. Explicitly dispatch main CI.
                await github.rest.actions.createWorkflowDispatch({
                  owner,repo,workflow_id:'ci.yml',ref:'main'
                });
                core.info('Dispatched main CI for the merge commit');
                break;
              } catch(e) {
                // Leave merge conflicts and ruleset failures unmerged.
                core.warning('PR #'+pr.number+' rejected by GitHub: HTTP '+
                  (e.status||'unknown')+' - '+e.message);
                if (e.status===409 || e.status===405 || e.status===422) continue;
                throw e;
              }
            }
            if (!merged) core.notice('No eligible PR; no unsafe merge attempted');
