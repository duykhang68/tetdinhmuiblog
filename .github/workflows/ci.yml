name: CI · Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Test and build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Syntax and automated tests
        run: npm run check

      - name: Production frontend build
        run: npm run build

      - name: Validate collector Python syntax and CLI
        run: |
          python3 -m py_compile collector.py
          python3 collector.py --help

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload validated frontend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: editor-web-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 30
