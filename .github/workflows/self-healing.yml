name: Self-Healing · CI Incident & Safe Autofix

on:
  workflow_run:
    workflows: ["CI · Quality Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      incident_run_id:
        description: 'Failed CI run ID from main (optional, for manual recovery)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: self-healing-${{ github.event.workflow_run.head_sha || inputs.incident_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Record incident in GitHub knowledge base
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      issues: write
      contents: read
    outputs:
      sha: ${{ steps.incident.outputs.sha }}
      run_id: ${{ steps.incident.outputs.run_id }}
    steps:
      - name: Record failure signature and known playbook
        id: incident
        uses: actions/github-script@v7
        env:
          MANUAL_RUN_ID: ${{ inputs.incident_run_id || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.eventName === 'workflow_dispatch'
              ? Number(process.env.MANUAL_RUN_ID) : context.payload.workflow_run.id;
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('Specify a valid failed CI run ID'); return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({owner, repo, run_id: runId});
            if (run.conclusion !== 'failure' || run.event !== 'push' || run.head_branch !== 'main') {
              core.setFailed('Only failed push CI runs on main may be recovered'); return;
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('run_id', String(runId));
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: runId, per_page: 100});
            const failedSteps = jobs.jobs.flatMap(job => (job.steps || [])
              .filter(step => step.conclusion === 'failure')
              .map(step => job.name + ' / ' + step.name));
            // Never store raw logs: they can include untrusted or sensitive text.
            const signature = failedSteps.join('; ').slice(0, 500) || 'Unknown failure step';
            const lockHint = failedSteps.some(x => /Install exact locked dependencies/i.test(x));
            const diagnosis = lockHint
              ? 'KNOWN: dependency lock mismatch or npm ci failure; attempt lock-only refresh with scripts disabled'
              : 'UNKNOWN: manual diagnosis required; no speculative code changes';
            const title = '[CI INCIDENT] ' + run.head_sha.slice(0, 12) + ' · run ' + runId;
            const body = [
              '## Incident (automatically recorded)',
              '- Run: ' + run.html_url,
              '- Commit: `' + run.head_sha + '`',
              '- Failed steps: ' + signature,
              '- Playbook: ' + diagnosis,
              '- Workflow: ' + run.name,
              '',
              '## Outcome / knowledge base',
              '- Status: TRIAGED',
              '- Recovery policy: deterministic changes only, full CI required',
              '- If a fix PR passes and merges, link it here and document the root cause.',
              '- Never bypass failing security tests or force-merge conflicts.'
            ].join('\n');
            const found = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100, creator: 'github-actions[bot]'
            });
            let incident = found.find(i => i.title === title);
            if (!incident) {
              const created = await github.rest.issues.create({owner, repo, title, body});
              incident = created.data;
            }
            core.notice('CI knowledge-base incident: ' + incident.html_url);

  safe_autofix:
    name: Repair lockfile safely (known pattern only)
    needs: diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out failed main commit, not PR-provided scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.diagnose.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Detect lockfile drift
        id: detect
        shell: bash
        run: |
          if npm ci --ignore-scripts --no-audit --no-fund; then
            echo 'repair_needed=false' >> "$GITHUB_OUTPUT"
            echo 'npm ci succeeds: no lock-only fix is justified'
          else
            echo 'repair_needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate only npm lockfile (without lifecycle scripts)
        if: steps.detect.outputs.repair_needed == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Restrict changes to known-safe lockfile
        if: steps.detect.outputs.repair_needed == 'true'
        id: guard
        shell: bash
        run: |
          git diff --exit-code -- . ':(exclude)package-lock.json'
          if git diff --quiet -- package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify proposed repair against same quality gate
        if: steps.guard.outputs.changed == 'true'
        run: |
          npm ci
          npm run check
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Create repair PR, never write directly to main
        if: steps.guard.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.diagnose.outputs.run_id }}
          SHA: ${{ needs.diagnose.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="autofix/lockfile-${SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- package-lock.json
          git commit -m "fix(build): synchronize npm lockfile for ${SHA:0:12}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" push origin "HEAD:refs/heads/$branch"
          gh pr create --head "$branch" --base main \
            --title "fix(build): safe lockfile recovery for ${SHA:0:12}" \
            --body "Automated deterministic recovery from failed CI run #$RUN_ID. Changed only package-lock.json. All local CI commands passed. Review CI results before merge. No force pushes or bypasses."

  # Automated merging is intentionally not enabled here: the repository currently
  # has allow_auto_merge=false and protected required checks are not yet verified.
  # Enable branch protection and auto-merge before adding a controlled merge gate.
