name: Researcher · Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - researcher.py
      - tests/test_researcher.py
      - .github/workflows/researcher.yml
      - .github/workflows/researcher-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Researcher regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_researcher.py -v
